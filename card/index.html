<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Afreen Handicraft | Premium Digital Card</title>
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            /* Royal Emerald & Gold Theme Palette */
            --emerald-deep: #031c15;
            --emerald-mid: #0a3b2c;
            --emerald-light: #135843;
            
            --gold-bright: #f3e098;
            --gold-primary: #d4af37;
            --gold-dark: #aa820a;
            --gold-gradient: linear-gradient(135deg, #f7e39c 0%, #d4af37 50%, #997819 100%);
            
            /* Action Button Gradients */
            --btn-call: linear-gradient(135deg, #28a745 0%, #1e7e34 100%);
            --btn-wa: linear-gradient(135deg, #25d366 0%, #128c7e 100%);
            --btn-web: linear-gradient(135deg, #007bff 0%, #0056b3 100%);
            
            --card-w: 360px;
            --card-h: 630px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: radial-gradient(circle at center, #0f4d3a 0%, #051d16 60%, #020c09 100%);
            font-family: 'Montserrat', sans-serif;
            overflow: hidden;
            padding: 20px 0;
        }

        /* Ambient Glow Effect Behind Card */
        .glow-bg {
            position: absolute;
            width: 420px;
            height: 420px;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.22) 0%, rgba(10, 59, 44, 0) 70%);
            border-radius: 50%;
            pointer-events: none;
            animation: pulseGlow 4s ease-in-out infinite alternate;
        }

        @keyframes pulseGlow {
            0% { transform: scale(0.9); opacity: 0.6; }
            100% { transform: scale(1.15); opacity: 1; }
        }

        /* Card Viewport & 3D Structure */
        .card-viewport {
            width: var(--card-w);
            height: var(--card-h);
            perspective: 1500px;
            position: relative;
            z-index: 2;
        }

        .main-card {
            width: 100%;
            height: 100%;
            position: relative;
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-style: preserve-3d;
            border-radius: 35px;
        }

        .main-card.is-flipped {
            transform: rotateY(180deg);
        }

        .face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 35px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 35px 25px;
            border: 2px solid rgba(212, 175, 55, 0.4);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7), 
                        inset 0 0 15px rgba(212, 175, 55, 0.15);
            overflow: hidden;
        }

        /* FRONT FACE DESIGN */
        .face-front {
            background: linear-gradient(160deg, #0d4634 0%, #062b20 50%, #031812 100%);
        }

        .face-front::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 30%, rgba(243, 224, 152, 0.08) 0%, transparent 50%);
            pointer-events: none;
        }

        /* Logo block now fills the free space and sits in the vertical centre */
        .face-front .logo-container {
            flex: 1;
            justify-content: center;
            margin-top: 0;
            padding-bottom: 10px;
        }

        .logo-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            width: 100%;
            margin-top: 10px;
        }

        /* Premium Circular Frame for Logo */
        .logo-ring {
            width: 250px;
            height: 250px;
            border-radius: 50%;
            padding: 5px;
            background: var(--gold-gradient);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5), 0 0 20px rgba(212, 175, 55, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            flex-shrink: 0;
        }

        .brand-logo {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            display: block;
        }

        .brand-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.85rem;
            font-weight: 700;
            margin-top: 30px;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1.5px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }

        .badge-tag {
            background: rgba(212, 175, 55, 0.15);
            border: 1px solid rgba(212, 175, 55, 0.4);
            color: var(--gold-bright);
            font-size: 0.7rem;
            font-weight: 700;
            padding: 5px 14px;
            border-radius: 20px;
            margin-top: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* BACK FACE DESIGN */
        .face-back {
            background: linear-gradient(160deg, #093326 0%, #051f17 100%);
            transform: rotateY(180deg);
        }

        .back-header {
            text-align: center;
            width: 100%;
            border-bottom: 1px solid rgba(212, 175, 55, 0.25);
            padding-bottom: 12px;
        }

        .back-header h3 {
            font-family: 'Playfair Display', serif;
            color: var(--gold-bright);
            font-size: 1.25rem;
            letter-spacing: 1px;
        }

        /* Business Details Card Overlay */
        .info-card {
            width: 100%;
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(212, 175, 55, 0.25);
            border-radius: 20px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .info-row {
            display: flex;
            align-items: center;
            gap: 12px;
            color: #e5f0ec;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .info-icon {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(212, 175, 55, 0.15);
            border: 1px solid rgba(212, 175, 55, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--gold-bright);
            font-size: 0.9rem;
            flex-shrink: 0;
        }

        .info-text {
            word-break: break-word;
        }

        /* Call To Action Buttons */
        .action-group {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn-action {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 13px;
            border-radius: 14px;
            text-decoration: none;
            color: #ffffff;
            font-weight: 700;
            font-size: 0.82rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: transform 0.2s, box-shadow 0.2s;
            border: none;
        }

        .btn-action:active {
            transform: scale(0.98);
        }

        .btn-call { background: var(--btn-call); }
        .btn-wa { background: var(--btn-wa); }
        .btn-web { background: var(--btn-web); }
        
        .btn-cat { 
            background: var(--gold-gradient); 
            color: #0d2b20;
            font-weight: 800;
        }

        /* Flip Toggle Button */
        .btn-flip {
            background: transparent;
            border: 2px solid var(--gold-primary);
            color: var(--gold-bright);
            padding: 12px 28px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 800;
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.15);
            transition: all 0.3s ease;
        }

        .btn-flip:hover {
            background: var(--gold-gradient);
            color: #062b20;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.4);
        }
    </style>
</head>
